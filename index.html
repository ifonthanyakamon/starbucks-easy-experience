<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Starbucks Thailand – Easy Experience Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#006241;--dg:#004C38;--lg:#E5F0E8;--cr:#F5F2E9;--t:#26352D;--bg:#dfe5e0;--red:#b3261e;--sh:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,60,40,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713}}
:root[data-theme="dark"]{--bg:#0f1713}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);display:flex;justify-content:center;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--t);line-height:1.45;-webkit-font-smoothing:antialiased}
#app{width:100%;max-width:420px;height:100%;max-height:880px;margin:auto;background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;font-size:15px}
#app.easy{font-size:19px}
@media(min-width:460px){#app{border-radius:34px;box-shadow:0 24px 70px #0005}}
h2,h3{margin:0;color:var(--dg);font-weight:700;letter-spacing:-.2px}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;box-shadow:0 2px 12px rgba(0,60,40,.07);position:relative;z-index:2}
.top b{flex:1;font-size:1.12em;color:var(--dg);font-weight:700}
.ib{border:0;background:#eef1ed;color:var(--t);border-radius:999px;min-height:38px;min-width:38px;padding:0 13px;font:inherit;font-weight:600;font-size:.88em;cursor:pointer;white-space:nowrap}
.easy .ib{min-height:50px;min-width:50px}.easy .tb{display:none}
.nu{background:var(--lg);color:var(--g);font-size:.8em;min-height:32px}
#scr{flex:1;overflow:auto;padding:16px 16px 30px;background:#f6f4ee}
.easy #scr{background:#fff}
.hint{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff7dc;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:500}
.prac{background:#fff3cd;border-radius:14px;padding:8px 12px;margin-bottom:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9em}
.b{display:block;width:100%;border:0;border-radius:999px;background:var(--g);color:#fff;font:inherit;font-weight:600;padding:13px;min-height:52px;margin:12px 0;cursor:pointer;box-shadow:0 8px 18px rgba(0,98,65,.22)}
.easy .b{min-height:66px;font-size:1.05em}
.b2{background:#fff;color:var(--g);border:1.5px solid var(--g);box-shadow:none}.bd{background:var(--red);box-shadow:none}
.card{border-radius:22px;padding:16px;margin:12px 0;background:#fff;box-shadow:var(--sh);cursor:pointer}
.easy .card{box-shadow:inset 0 0 0 2px #cfd8d2}
.card.sel{background:#eef6f0;box-shadow:inset 0 0 0 2px var(--g)}
.dark{background:linear-gradient(150deg,#21413a,#10241d);color:#fff;border-radius:26px;padding:20px}.dark small{color:#cfe0d6}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 0}
small,.s{color:#5c6b62;font-size:.85em}.easy small,.easy .s{color:#33433a}
.big{font-size:2.1em;font-weight:800;letter-spacing:-.5px}
.hh{background:linear-gradient(150deg,#0b7a52,#004C38);color:#fff;border-radius:28px;padding:20px;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:6px;box-shadow:0 10px 24px rgba(0,98,65,.25)}
.hh h2{color:#fff;font-size:1.35em;margin:2px 0 4px}.hh small{color:#d4eadd}.hh svg{flex:none;filter:drop-shadow(0 8px 10px #0004)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.easy .grid{grid-template-columns:1fr}
.sv{background:#fff;border:0;border-radius:22px;padding:16px 14px;text-align:left;font:inherit;color:var(--t);box-shadow:var(--sh);cursor:pointer;min-height:128px}
.sv i{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--lg);color:var(--g);margin-bottom:10px;font-style:normal;font-size:1.3em}
.sv b{display:block;font-weight:700}.sv small{display:block;margin-top:3px;line-height:1.35}
.easy .sv{display:flex;align-items:center;gap:14px;min-height:88px}.easy .sv i{margin:0;width:58px;height:58px;flex:none}
.easy .x,.easy .nz{display:none}
.in{width:100%;border:0;background:#fff;box-shadow:var(--sh);border-radius:999px;padding:12px 18px;font:inherit}
.chip{display:inline-block;border:0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);border-radius:999px;padding:9px 16px;margin:4px 6px 4px 0;font:inherit;font-weight:500;cursor:pointer}
.chip.on{background:var(--g);color:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 8px;padding:2px 16px 6px}.tabs .chip{flex:none;margin:0}
.pc{display:flex;gap:12px;background:#fff;border-radius:22px;padding:12px;margin:10px 0;box-shadow:var(--sh);cursor:pointer}
.pi{flex:none;width:84px;height:84px;border-radius:18px;background:var(--cr);display:flex;align-items:center;justify-content:center;font-size:40px}
.pt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.add{width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.svc{background:#fff;border-radius:24px;overflow:hidden;margin:14px 0;box-shadow:var(--sh);cursor:pointer}
.svc .art{background:var(--cr);display:flex;justify-content:center;gap:4px;padding:16px 0 10px}.svc .tx{padding:14px 16px 16px}.svc p{margin:6px 0 4px}
.tag{font-size:.72em;background:var(--lg);color:var(--g);border-radius:999px;padding:3px 10px;font-weight:700;white-space:nowrap}
.cup{background:var(--cr);border-radius:24px;display:flex;justify-content:center;padding:20px;margin-bottom:14px}
.stp{display:flex;gap:6px;margin:14px 0}.stp div{flex:1;text-align:center;font-size:.78em;color:#7b867f;font-weight:500}
.stp div:before{content:"";display:block;height:8px;border-radius:4px;background:#d5dbd6;margin-bottom:6px}.stp .d:before{background:var(--g)}.stp .d{color:var(--t);font-weight:700}
.stp2{margin:0 0 14px}.stp2 div{display:flex;gap:5px;margin-bottom:6px}.stp2 span{flex:1;height:10px;border-radius:5px;background:#d5dbd6}.stp2 span.d{background:var(--g)}.stp2 b{color:var(--dg)}
.bar{height:10px;background:#ffffff33;border-radius:5px;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;background:#4ccf8f}
.ok{width:76px;height:76px;border-radius:50%;background:var(--g);color:#fff;font-size:42px;display:flex;align-items:center;justify-content:center;margin:24px auto 28px;box-shadow:0 0 0 10px var(--lg),0 0 0 20px #f1f7f3}
.seg{display:flex;background:#e7ebe7;border-radius:999px;padding:4px;margin:12px 0}.seg button{flex:1;border:0;background:none;border-radius:999px;padding:10px 6px;font:inherit;font-weight:600;font-size:.88em;color:#4b5a51;cursor:pointer}.seg button.on{background:#fff;color:var(--g);box-shadow:0 2px 8px rgba(0,60,40,.15)}
.sw{width:56px;height:32px;border-radius:16px;border:0;background:#b9c2bc;position:relative;flex:none;cursor:pointer}.sw:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--g)}.sw.on:after{left:27px}
nav{display:flex;border-top:0;box-shadow:0 -6px 18px rgba(0,60,40,.08);background:#fff;padding-bottom:4px}
nav button{flex:1;border:0;background:none;padding:8px 0;font:inherit;font-size:.72em;font-weight:500;color:#6b766f;cursor:pointer}nav button.on{color:var(--g);font-weight:700}
nav i{display:block;width:56px;margin:0 auto 2px;padding:3px 0;border-radius:16px}nav .on i{background:var(--lg)}nav svg{display:block;margin:auto}
.easy nav button{font-size:.85em}
hr{border:0;border-top:1.5px dashed #d5dbd6;margin:12px 0}
#modal{position:absolute;inset:0;background:#000a;display:none;align-items:flex-end;z-index:5}
#modal>div{background:#fff;width:100%;border-radius:28px 28px 0 0;padding:26px 20px 28px;position:relative}
#modal>div:before{content:"";position:absolute;top:9px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:#d5dbd6}
#toast{position:absolute;left:14px;right:14px;top:70px;z-index:9;padding:12px 14px;border-radius:16px;background:var(--dg);color:#fff;font-weight:600;display:none;box-shadow:0 8px 22px #0003}#toast.err{background:var(--red)}
.scan{background:#140d0a;color:#fff;margin:-16px -16px -30px;padding:24px 16px;min-height:100%;text-align:center}
.frame{width:210px;height:210px;margin:20px auto;border:4px solid #fff;border-radius:40px;display:flex;align-items:center;justify-content:center;font-size:3em}
.pink{background:#f4d8de;border-radius:22px;text-align:center;padding:32px 10px;color:#d85a7a;font-weight:800;box-shadow:var(--sh)}
#app{overflow-wrap:break-word;word-wrap:break-word}
.row>*,.hh>div,.hint>span,.pt,.tx{min-width:0}
.row{flex-wrap:wrap}
.row>:last-child:not(:first-child){text-align:right;margin-left:auto}
.row[style*="flex-start"]>:last-child{margin-left:0;text-align:left}
.top b{min-width:0;line-height:1.2}.top .ib{flex:none}
.b{line-height:1.3;padding:13px 18px}
.seg button{padding:10px 8px;line-height:1.25}
.stp div{padding:0 2px;line-height:1.25}
.easy .stp{display:grid;grid-template-columns:1fr 1fr;gap:10px 8px}
.grid[style*="repeat(3"] .sv{padding:12px 4px;font-size:.9em;min-width:0}.grid[style*="repeat(3"] .sv b{text-align:center}
.easy .grid[style*="repeat(3"]{grid-template-columns:1fr!important}
.easy .grid[style*="repeat(3"] .sv{display:flex;align-items:center;gap:12px;min-height:80px!important;text-align:left!important}
.easy .grid[style*="repeat(3"] .sv i{margin:0!important}
.pink{font-size:1.15em;line-height:1.2}
.chip{max-width:100%;white-space:normal;text-align:center;line-height:1.25}.tabs .chip{white-space:nowrap}
.tag{max-width:50%;text-align:center}
@media(max-width:370px){.top .tb{display:none}.top .ib{padding:0 10px}}
</style></head><body><div id="app"><div id="toast"></div><div class="top" id="top"></div><div id="scr"></div><nav id="nav"></nav><div id="modal"></div></div>
<script>
const S={easy:false,stars:28,bal:260,cart:[],pay:'card',kind:'order',amt:300,bill:145,flow:'',hist:[],cur:'home',store:null,addr:'',table:'',q:'',sv:null,item:null,o:{sz:0,tp:0,sw:0,q:1},st:0,no:0,ri:0,fail:false,us:false,prac:false,cat:0};
const $=s=>document.querySelector(s),app=$('#app'),fmt=n=>'฿'+n.toFixed(2);let T;
const M=[['Toffee Nut Crunch Latte',150,'#b07a4a',1,'Toffee nut and caramel notes, our festive favourite',1],['Peppermint Mocha',155,'#7a3b2e',1,'Chocolate mocha with cool peppermint',1],['Americano',105,'#3a2a20',1,'Rich espresso topped with hot water',0],['Cold Brew',130,'#4a3626',1,'Slow-steeped, smooth and refreshing',1],['S’more Pure Matcha Oatmilk Latte',165,'#6a9a5a',2,'Matcha with oat milk and marshmallow',1],['Joyful Medley Latte',150,'#c46a5a',2,'Festive spiced latte, gently sweet',0],['Joyful Medley Tea',120,'#c98a4a',3,'Full-leaf brewed tea with fruit and spice',0],['Green Tea Latte',140,'#8bb36b',3,'Smooth green tea with steamed milk',0],['Butter Croissant',85,'#d9a05b',4,'Freshly baked, flaky outside, soft inside',1],['Chocolate Brownie',95,'#5b3a29',4,'Dense, fudgy and rich',0]];
const CAT=['Recommended','Coffee','Non-Coffee','Tea','Bakery'];
const ST=[{n:'Susco Itsaraphap',a:'Itsaraphap Rd, Wat Arun, Bangkok Yai',d:'0.3',o:0,h:'Closed · Opens Monday 06:30'},{n:'Baan Chart',a:'98 Baan Chart, Jakkraphong Rd',d:'2.4',o:1,h:'Open · 07:00–21:00'},{n:'I’m China Town',a:'Charoen Krung Rd',d:'2.9',o:1,h:'Open · 08:00–22:00'},{n:'ICONSIAM',a:'299 Charoen Nakhon Rd, Khlong San',d:'3.1',o:1,h:'Open · 10:00–22:00'}];
const R=[[20,'Free upsize','Upsize your favourite drink (Tall → Grande)'],[60,'Free extra shot or topping','Add an espresso shot or a topping'],[120,'Free bakery item','Choose one eligible bakery item'],[160,'Free drink','Any one Tall handcrafted drink'],[350,'Premium reward','An eligible Starbucks merchandise item']];
const PM={card:['💳','Starbucks Card'],pp:['📱','PromptPay'],bank:['🏦','Bank account']};
const FN={del:'Delivery',pick:'In-store Pickup',tab:'Order to Table'};
const SZ=[['Tall',0],['Grande',15],['Venti',30]],TP=['Hot','Iced','Blended'],SW=['Regular sweet','Less sweet','No sugar'];
const cup=(c,w=64)=>`<svg width="${w}" height="${w}" viewBox="0 0 60 60"><path d="M36 3l-4 13" stroke="#006241" stroke-width="3" stroke-linecap="round"/><path d="M15 15c0-6 30-6 30 0z" fill="#f4f6f4"/><rect x="12" y="15" width="36" height="5" rx="2.5" fill="#e3e8e4"/><path d="M14 20h32l-3.5 36a3 3 0 0 1-3 2.5H20.5a3 3 0 0 1-3-2.5z" fill="${c}"/><path d="M14.4 20h31.2l-.7 8H15.1z" fill="#fff" opacity=".85"/><circle cx="30" cy="41" r="6.5" fill="#006241"/><circle cx="30" cy="41" r="3" fill="#fff"/></svg>`;
const sv=d=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={h:sv('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),c:sv('<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>'),o:sv('<path d="M6 8h12l-1.4 12.5H7.4z"/><path d="M5 4.5h14V8H5z"/>'),m:sv('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 7l9 6 9-6"/>'),a:sv('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),p:sv('<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>'),s:sv('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>')};
const qr=()=>{let r='',s=7;for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);let on;if(f){const a=x%14,b=y%14;on=a==0||a==6||b==0||b==6||(a>1&&a<5&&b>1&&b<5)}else{s=(s*37+11)%101;on=s%2==0}if(on)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="0 0 21 21" width="150" height="150" style="display:block;margin:10px auto" fill="#000">${r}</svg>`};
const btn=(l,a,c='')=>`<button class="b ${c}" onclick="${a}">${l}</button>`;
const disc=()=>S.us?15:0,tot=()=>S.cart.reduce((s,i)=>s+i.p*i.q,0)-disc(),cnt=()=>S.cart.reduce((s,i)=>s+i.q,0),fee=()=>S.flow=='del'?25:0;
function toast(m,e){const t=$('#toast');t.textContent=(e?'⚠️ ':'✅ ')+m;t.className=e?'err':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function modal(h){$('#modal').innerHTML='<div>'+h+'</div>';$('#modal').style.display='flex'}
function cm(){$('#modal').style.display='none'}
function go(n,r){clearTimeout(T);if(!r)S.hist.push(S.cur);S.cur=n;draw()}
function go2(n){clearTimeout(T);S.cur=n;draw()}
function back(){clearTimeout(T);S.cur=S.hist.pop()||'home';draw()}
function home(){clearTimeout(T);S.hist=[];S.cur='home';draw()}
function go3(i){S.hist=[];go2(['inbox','acct'][i])}
function tog(){S.easy=!S.easy;draw();toast(S.easy?'Large text & step-by-step is on':'Back to standard view')}
function fl(f,s){S.us=false;S.flow=f;S.cart=[];S.store=null;S.addr='';S.table='';S.kind='order';S.pay='card';S.st=0;go(s)}
function say(){try{const s=SC[S.cur]();const u=new SpeechSynthesisUtterance(s.h||s.t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast('Voice guidance is not supported on this device',1)}}
function help(){const s=SC[S.cur]();modal(`<h3 style="margin:6px 0 8px">Need help?</h3><p>${s.h||'Tap ← Back at any time to return to the previous screen.'}</p>${btn('🔊 Listen to this help','say()','b2')}${btn('Call a Starbucks partner',"cm();toast('Help request sent (simulated)')")}${btn('Close','cm()','b2')}`)}
function newUser(){modal(`<h3 style="margin:6px 0 2px">👋 Welcome to Starbucks</h3><small>Choose the view that feels comfortable. You can change it anytime.</small><div class="seg"><button class="${S.easy?'':'on'}" onclick="if(S.easy)tog();newUser()">Standard</button><button class="${S.easy?'on':''}" onclick="if(!S.easy)tog();newUser()">Large text &amp; step-by-step</button></div>${['Tap the service you want on the home screen.','Follow the step shown at the top of each screen.','Tap ❓ for help, or ← Back to go back.'].map((t,i)=>`<div class="row" style="justify-content:flex-start;margin:8px 0"><span class="ib" style="flex:none">${i+1}</span><span>${t}</span></div>`).join('')}${btn('🎓 Try practice mode (no real charge)',"cm();S.prac=true;draw();toast('Practice mode on. Nothing is charged.')",'b2')}${btn('Get started','cm()')}`)}
const PS={dhome:1,dloc:1,dstore:1,phome:1,psel:1,thome:1,tins:1,tscan:1,tconf:1,menu:2,pd:2,cart:3,sum:3,paym:4,oconf:5,ostat:5,ready:5,pdone:5};
function steps(){const c=S.cur,R3={rw:1,earn:1,guide:1,redeem:2,rdone:3},C4={topup:1,paystore:1,paym:2,pconf:3,pok:4};let i,n;if(R3[c]){i=R3[c];n=3}else if(S.kind!='order'&&C4[c]){i=C4[c];n=4}else if(PS[c]){i=PS[c];n=5}else return'';return`<div class="stp2"><div>${Array.from({length:n},(_,k)=>`<span class="${k<i?'d':''}"></span>`).join('')}</div><b>Step ${i} of ${n}</b></div>`}
function draw(){const s=SC[S.cur](),tab=['home','card','order','inbox','acct'].includes(S.cur),hm=S.cur=='home';app.className=S.easy?'easy':'';
$('#top').innerHTML=(tab?'':`<button class="ib" onclick="back()" aria-label="Back">← ${S.easy?'Go back':'Back'}</button>`)+`<b>${s.t}</b>`+(hm?'<button class="ib nu" onclick="newUser()">👋 New here?</button><button class="ib tb" onclick="go3(0)" aria-label="Notifications">🔔</button><button class="ib tb" onclick="go3(1)" aria-label="Account">👤</button>':'')+`<button class="ib" onclick="help()">❓${S.easy?' Help':''}</button>`;
const keep=draw.c==S.cur?$('#scr').scrollTop:0;draw.c=S.cur;
$('#scr').innerHTML=(S.prac?'<div class="prac"><span>🎓 Practice mode · nothing is charged</span><button class="ib" onclick="S.prac=false;draw();toast(\'Practice mode off\')">Exit</button></div>':'')+(S.easy?steps():'')+(S.easy&&s.h?`<div class="hint"><span>💡 ${s.h}</span><button class="ib" onclick="say()">🔊 Listen</button></div>`:'')+s.b;$('#scr').scrollTop=keep;
$('#nav').style.display=tab?'flex':'none';
$('#nav').innerHTML=[['home',IC.h,'Home'],['card',IC.c,'Card'],['order',IC.o,'Order'],['inbox',IC.m,'Inbox'],['acct',IC.a,'Account']].map(n=>`<button class="${S.cur==n[0]?'on':''}" onclick="S.hist=[];go2('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join('');
if(S.cur=='ostat'&&S.st<3)T=setTimeout(adv,5000)}
function adv(){if(S.cur!='ostat')return;if(S.st<3){S.st++;if(S.st==2)toast(S.flow=='pick'?'🔔 Your order is ready for pickup!':S.flow=='tab'?'🔔 Your drinks are on the way to your table':'🔔 Your rider is on the way');draw()}}
function stores(act){const q=S.q.toLowerCase();return ST.map((s,i)=>({...s,i})).filter(s=>(s.n+s.a).toLowerCase().includes(q)).map(s=>`<div class="card" onclick="${act}(${s.i})"><div class="row"><b>${s.n}</b><button class="ib" onclick="event.stopPropagation();S.sv=${s.i};go('stdet')">ⓘ Info</button></div><small>${s.a}</small><br><small>📍 ${s.d} km away</small> <b style="color:${s.o?'#006241':'#b3261e'}">${s.o?'● Open':'● Closed'}</b> <small>${s.h.split('· ')[1]||''}</small></div>`).join('')||'<p>No stores found. Try “Baan” or “Charoen”.</p>'}
function filt(v){S.q=v;$('#list').innerHTML=stores(S.cur=='psel'?'pickSt':'viewSt')}
function viewSt(i){S.sv=i;go('stdet')}
function pickSt(i){const s=ST[i];if(!s.o)return toast('This store is closed. Please choose another.',1);S.store=s;toast('Store selected: '+s.n);go('menu')}
function addCart(){const m=S.item,o=S.o,p=m[1]+(m[3]==4?0:SZ[o.sz][1]),k=m[0]+o.sz+o.tp+o.sw,e=S.cart.find(c=>c.k==k);if(e)e.q+=o.q;else S.cart.push({k,n:m[0],p,q:o.q,d:m[3]==4?'Served warm':`${SZ[o.sz][0]} · ${TP[o.tp]} · ${SW[o.sw]}`});toast('Added '+m[0]+' to your cart');back()}
function qty(i,d){S.cart[i].q+=d;if(S.cart[i].q<1)S.cart.splice(i,1);draw()}
function opt(k,v){S.o[k]=v;draw()}
function sel(k){S.pay=k;draw()}
function place(){cm();const t=tot()+fee();if(S.pay=='card'&&S.bal<t){const n=Math.ceil((t-S.bal)/50)*50;return modal(`<h3 style="margin:6px 0">Not enough balance on your Card</h3><p>You need ${fmt(t)} but your Card has ${fmt(S.bal)}. Top up just ${fmt(n)}, or pay directly without topping up.</p>${btn('Top up '+fmt(n)+' and pay',"S.bal+=Math.ceil((tot()+fee()-S.bal)/50)*50;place()")}${btn('Choose another payment method',"cm();go('paym')",'b2')}`)}
if(S.pay=='card'&&!S.prac)S.bal-=t;if(S.us&&!S.prac)S.stars-=20;S.no++;S.st=0;S.hist=['home'];go('oconf',1)}
function cancelO(){modal(`<h3 style="margin:6px 0">Cancel this order?</h3><p>${fmt(tot()+fee())} will be refunded ${S.pay=='card'?'to your Starbucks Card right away':'to your payment method'}.</p>${btn('Yes, cancel order','doCancel()','bd')}${btn('Keep my order','cm()','b2')}`)}
function doCancel(){cm();if(S.pay=='card'&&!S.prac)S.bal+=tot()+fee();S.cart=[];S.us=false;S.hist=[];clearTimeout(T);S.cur='home';draw();toast('Order cancelled and refunded')}
function redeem(){cm();const r=R[S.ri];if(S.stars<r[0])return toast(`You need ${r[0]-S.stars} more stars`,1);S.stars-=r[0];S.hist=['home','rw'];go('rdone',1)}
function pay(){cm();modal('<h3 style="text-align:center;margin:6px 0">Processing…</h3><p style="text-align:center;font-size:2em">⏳</p>');setTimeout(()=>{cm();if(S.kind=='topup')S.bal+=S.amt;else if(S.pay=='card'&&!S.prac)S.bal-=S.bill;S.hist=['home','card'];go('pok',1)},1100)}
function payRows(){const a=S.kind=='topup'?S.amt:S.bill;return`<div class="card" style="cursor:default"><div class="row"><span>Type</span><b>${S.kind=='topup'?'Top up Starbucks Card':'Pay in store (direct)'}</b></div><div class="row"><span>Payment method</span><b>${PM[S.pay][0]} ${PM[S.pay][1]}</b></div><div class="row"><span>Amount</span><b>${fmt(a)}</b></div>${S.kind=='topup'?`<div class="row"><span>Card balance after top up</span><b>${fmt(S.bal+S.amt)}</b></div>`:S.pay=='card'?`<div class="row"><span>Card balance after payment</span><b>${fmt(S.bal-S.bill)}</b></div>`:'<small>No top up needed. You pay only this amount.</small>'}</div>`}

home:()=>({t:'Starbucks',h:'Tap the big button for what you want to do. Tap ❓ if you need help.',b:`<div class="hh"><div><small>Good evening, Thanyakamon</small><h2>What would you like today?</h2><small>Your favourite drink is just a few taps away.</small></div>${cup('#b07a4a',92)}</div>

pd:()=>{const m=S.item,o=S.o,ch=(k,a)=>a.map((x,i)=>`<button class="chip ${o[k]==i?'on':''}" onclick="opt('${k}',${i})">${Array.isArray(x)?x[0]+(x[1]?' +฿'+x[1]:''):x}</button>`).join('');return{t:'Customise',h:'Choose size, temperature and sweetness, then add to cart.',b:`<div class="cup">${m[3]==4?`<span style="font-size:64px">${m[0][0]=='B'&&m[0][1]=='u'?'🥐':'🍫'}</span>`:cup(m[2],96)}</div><h3>${m[0]}</h3><small>${m[4]}</small>${S.easy&&m[3]!=4?btn('⭐ Order the recommended way (Grande · Hot · Regular)',"S.o={sz:1,tp:0,sw:0,q:1};addCart()")+'<p class="s">Or customise it yourself:</p>':''}${m[3]==4?'<p class="s">Served warm. No customisation needed.</p>':`<p><b>Size</b> <small>(price changes with size)</small><br>${ch('sz',SZ)}</p><p><b>Temperature</b><br>${ch('tp',TP)}</p><p><b>Sweetness</b><br>${ch('sw',SW)}</p>`}<div class="row"><b>Quantity</b><span><button class="ib" onclick="S.o.q=Math.max(1,S.o.q-1);draw()">−</button> <b style="padding:0 10px">${o.q}</b><button class="ib" onclick="S.o.q++;draw()">+</button></span></div>${btn('Add to cart · '+fmt((m[1]+(m[3]==4?0:SZ[o.sz][1]))*o.q),'addCart()')}`}},
cart:()=>({t:'Cart',h:'Check your items and quantities, then continue.',b:S.cart.length?S.cart.map((c,i)=>`<div class="card" style="cursor:default"><b>${c.n}</b><br><small>${c.d}</small><div class="row"><b>${fmt(c.p*c.q)}</b><span><button class="ib" onclick="qty(${i},-1)" aria-label="Decrease">−</button> <b style="padding:0 8px">${c.q}</b><button class="ib" onclick="qty(${i},1)" aria-label="Increase">+</button></span></div></div>`).join('')+`<div class="row"><b>Subtotal</b><b class="big" style="font-size:1.4em">${fmt(tot())}</b></div>${btn('Continue to order summary',"go('sum')")}${btn('+ Add more drinks','back()','b2')}`:`<p style="text-align:center">🛒 Your cart is empty</p>${btn('Browse the menu','back()')}`}),
sum:()=>({t:'Order summary',h:'Check the store, payment method and total, then confirm.',b:`<div class="card" style="cursor:default"><b>${S.flow=='del'?'📍 Deliver to: '+S.addr:S.flow=='tab'?'🪑 Table '+S.table:'🏪 Pickup store'}</b><br>Store: <b>${S.store.n}</b> <small>${S.flow=='del'?'(selected by the system)':''}</small></div>${S.cart.map(c=>`<div class="row"><span>${c.q}× ${c.n}</span><span>${fmt(c.p*c.q+(0))}</span></div>`).join('')}${S.us?`<div class="row"><span>⭐ Free upsize</span><span>-฿15.00</span></div>`:''}${fee()?`<div class="row"><span>Delivery fee</span><span>${fmt(fee())}</span></div>`:''}<hr><div class="row"><b>Total</b><b>${fmt(tot()+fee())}</b></div><div class="card ${S.us?'sel':''}" onclick="if(S.stars<20&&!S.us)return toast('You need at least 20 stars',1);S.us=!S.us;draw()"><div class="row"><span>⭐ Use 20★ for a free upsize (−฿15)</span><b>${S.us?'✔ Applied':'Tap to use'}</b></div><small>You have ${S.stars}★ · optional</small></div><div class="card" onclick="go('paym')"><div class="row"><span>Payment method</span><b>${PM[S.pay][0]} ${PM[S.pay][1]} · Change ›</b></div></div>${btn('Place order',"modal('<h3 style=\"margin:6px 0\">Place this order?</h3><p>"+fmt(tot()+fee())+" with "+PM[S.pay][1]+" · "+S.store.n+"</p><button class=\"b\" onclick=\"place()\">Confirm</button><button class=\"b b2\" onclick=\"cm()\">Review again</button>')")}`}),
oconf:()=>({t:'Order placed',h:'Tap Track order to see progress.',b:`<div class="ok">✓</div><h2 style="text-align:center">Order placed</h2><div class="card" style="text-align:center;cursor:default"><small>Order number</small><div class="big">#${100+S.no}</div>Paid with ${PM[S.pay][1]} · ${fmt(tot()+fee())}</div>${btn('Track order',"go('ostat')")}<p class="s" style="text-align:center">Don’t worry, you can cancel before we start preparing your drink.</p>`}),
ostat:()=>{const A=['Order received','Preparing your drink'],L={pick:[...A,'Ready for pickup','Picked up'],del:[...A,'On the way','Delivered'],tab:[...A,'Being served','Served']}[S.flow],msg=['The store has your order.','A barista is making your drink.',S.flow=='pick'?'Your drink is ready!':S.flow=='del'?'Your rider is on the way.':'We are bringing it to your table.','All done. Enjoy!'];return{t:'Order #'+(100+S.no),h:'Green steps are done. This screen updates by itself.',b:`<div class="stp">${L.map((l,i)=>`<div class="${i<=S.st?'d':''}">${l}</div>`).join('')}</div><div class="card ${S.st>=2?'sel':''}" style="cursor:default"><h3>${L[S.st]}</h3>${msg[S.st]}${S.st==2&&S.flow=='pick'?'<br>📍 Collect at the pickup counter, '+S.store.n:''}</div><div class="card" style="cursor:default"><small>${S.store.n}</small><br>${S.cart.map(c=>c.q+'× '+c.n).join('<br>')}<br><b>${fmt(tot()+fee())}</b></div>${S.st<2?btn('Cancel order (no charge)','cancelO()','b2'):''}${S.st<3?btn('⏩ Simulate next status','adv()','b2'):''}${S.st>=2&&S.flow=='pick'&&S.st<3?btn('View pickup point',"go('ready')"):''}${S.st==3?btn('Back to Home','home()'):''}`}},
ready:()=>({t:'Ready for pickup',h:'Go to the pickup counter and show your order number.',b:`<div class="ok">🥤</div><h2 style="text-align:center">Your drink is ready</h2><div class="card" style="text-align:center;cursor:default"><div class="big">#${100+S.no}</div>📍 Pickup counter, right side of the bar<br><small>${S.store.n}</small></div>${btn('I’ve picked up my order',"S.st=3;S.hist=['home'];go('pdone',1)")}`}),
pdone:()=>({t:'Picked up',b:`<div class="ok">✓</div><h2 style="text-align:center">Order picked up</h2><p style="text-align:center">Thank you for using In-store Pickup.</p>${btn('Back to Home','home()')}`})
};
draw();
</script></body></html>
